name: maplibre_flutter_ios
description: >-
  The default iOS implementation of maplibre_flutter (mbgl-core via FFI, rendered
  into a Flutter Texture with Metal).
version: 0.0.2
repository: https://github.com/Mankeli-Software/maplibre_flutter

environment:
  sdk: ^3.12.2
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  maplibre_flutter_platform_interface: ^0.0.2
  # The shared desktop core engine: iOS renders mbgl-core (Metal) into a Flutter
  # Texture, the same engine as every other platform. Because this package no
  # longer links the MapLibre Apple SDK, there is no mbgl symbol duplication.
  maplibre_flutter_core: ^0.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: maplibre_flutter
    platforms:
      ios:
        # Hybrid (dartPluginClass + pluginClass): the Dart class registers the
        # implementation; the native plugin owns the texture registrar that
        # presents mbgl-core's Metal frames into a Flutter Texture (CLAUDE.md §3).
        # Packaged for both SPM and CocoaPods (§9); sharedDarwinSource not used.
        dartPluginClass: MapLibreFlutterIos
        pluginClass: MaplibreFlutterIosPlugin
