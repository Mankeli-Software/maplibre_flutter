name: maplibre_flutter_android
description: >-
  The default Android implementation of maplibre_flutter (mbgl-core via FFI,
  rendered into a Flutter Texture).
version: 0.0.3
repository: https://github.com/Mankeli-Software/maplibre_flutter

environment:
  sdk: ^3.12.2
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  maplibre_flutter_platform_interface: ^0.0.3
  # The shared desktop core engine: Android renders mbgl-core into a Flutter
  # Texture (the same engine as every other platform). The native present bridge
  # lives in android/src/main (a small JNI lib + OkHttp HTTP source).
  maplibre_flutter_core: ^0.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: maplibre_flutter
    platforms:
      android:
        # Hybrid (dartPluginClass + pluginClass): the Dart class registers the
        # implementation; the native plugin owns the texture registrar that
        # presents mbgl-core's frames into a Flutter Texture (CLAUDE.md §3).
        dartPluginClass: MapLibreFlutterAndroid
        pluginClass: MaplibreFlutterAndroidPlugin
        package: dev.maplibreflutter.maplibre_flutter_android
