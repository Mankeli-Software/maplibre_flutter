name: maplibre_flutter_web_gljs
description: >-
  Opt-in maplibre-gl-js web implementation of maplibre_flutter (via
  dart:js_interop, HtmlElementView). Add it to render with maplibre-gl-js instead
  of the default mbgl-core WASM renderer.
version: 0.0.2
repository: https://github.com/Mankeli-Software/maplibre_flutter

environment:
  sdk: ^3.12.2
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  maplibre_flutter_platform_interface: ^0.0.2
  # DOM bindings for dart:js_interop (replaces dart:html, WASM-safe). The
  # interop with maplibre-gl-js itself uses dart:js_interop / dart:ui_web, which
  # ship with the SDK and need no dependency (CLAUDE.md §5).
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: maplibre_flutter
    platforms:
      web:
        # Opt-in alternative to the endorsed core (WASM) web default. An app that
        # depends on this package directly overrides the default and renders with
        # maplibre-gl-js. Distinct pluginClass name from the core package so both
        # can coexist in a dependency tree without a registrant collision.
        pluginClass: MapLibreFlutterWebGljs
        fileName: maplibre_flutter_web_gljs.dart
