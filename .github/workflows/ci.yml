# Quality gate for the maplibre_flutter workspace (CLAUDE.md §7 layer 6).
#
# macOS and Web run the full end-to-end suites. iOS, Android, Linux and Windows
# get COMPILE gates: none of them can be run on hardware here, so `flutter build`
# is the only automated signal that their native halves — Swift + Metal, Kotlin +
# JNI + GL ES, EGL, Vulkan + vcpkg — even build. Before this, the sole automated
# check covering those four was `dart analyze`, which cannot see a line of native
# code.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    env:
      # Build mbgl-core from the vendored submodule (don't fetch a prebuilt).
      MAPLIBRE_FLUTTER_BUILD_FROM_SOURCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # vendors mbgl-core at the pinned core-<sha>

      - uses: subosito/flutter-action@v2
        with:
          channel: stable # must satisfy the pubspec floor (Flutter >= 3.41)

      - run: brew install cmake ninja ccache

      # mbgl-core is large; cache ccache across runs (keyed on the pinned core sha).
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ hashFiles('packages/maplibre_flutter_core/MBGL_CORE_VERSION') }}
          restore-keys: ccache-macos-
      - run: |
          ccache --set-config=hash_dir=false
          ccache --set-config=max_size=3G

      # WITHOUT THIS THE NATIVE GATES PROVE NOTHING. The build hook that compiles
      # mbgl-core only runs when native assets are enabled; on a fresh runner the
      # flag is off, so every `flutter build` below would succeed having compiled
      # zero lines of the engine. It is set locally on the dev machine, which is
      # exactly why it was easy to miss.
      - run: flutter config --enable-native-assets

      - run: flutter pub get

      - run: dart run melos run format
      - run: dart run melos run analyze
      - run: dart run melos run test --no-select
      - run: dart run melos run test:native --no-select # builds mbgl-core

      # The C++ probes assert things no Dart test can reach: the text-shaping
      # patch against mbgl's own layout, .glb parse invariants, the projection
      # and anchor origin conventions, and that a 3D model actually renders.
      # They existed for months, built and run by nothing.
      - run: dart run melos run test:harness

      # Podspec versions drift from pubspecs silently — melos version does not
      # touch them — and nothing catches it until `pod lib lint` at release.
      - run: dart run melos run verify:podspecs

      - name: Generated ffigen bindings are up to date
        working-directory: packages/maplibre_flutter_core
        run: |
          dart run tool/ffigen.dart
          git diff --exit-code lib/src/maplibre_flutter_core_bindings_generated.dart

      # The typed style API is generated from the style spec vendored in the
      # mbgl-core submodule, so a core bump that changes the spec must show up
      # here as a diff rather than drifting silently (CLAUDE.md §7 layer 6).
      - name: Generated typed style API is up to date
        working-directory: packages/maplibre_flutter
        run: |
          dart run tool/generate_style_api.dart
          # --intent-to-add so a NEWLY generated file (a layer type added to the
          # allowlist but not committed) shows up in the diff instead of being
          # ignored as untracked.
          git add --intent-to-add lib/src/style/generated
          git diff --exit-code lib/src/style/generated

  # Web tier: pure Dart + maplibre-gl-js (no native toolchain, no submodule),
  # so it runs on the cheapest runner. Builds the example for the web and runs
  # the browser tests + the real-browser integration test.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # no submodules — the web tier has no native code

      - uses: subosito/flutter-action@v2
        with:
          channel: stable # must satisfy the pubspec floor (Flutter >= 3.41)

      - run: flutter pub get

      # Compile gate: the whole web tier (js_interop + package:web + dart:ui_web)
      # must build.
      - run: flutter build web
        working-directory: packages/maplibre_flutter/example

      # Browser unit tests (flutter test --platform chrome).
      - run: dart run melos run test:web --no-select

      # End-to-end: a real maplibre-gl-js map in headless Chrome (CLAUDE.md §7
      # layer 5). Needs a chromedriver on :4444.
      - uses: nanasess/setup-chromedriver@v2
      - name: Web integration test (headless Chrome)
        working-directory: packages/maplibre_flutter/example
        run: |
          chromedriver --port=4444 &
          sleep 2
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/web_map_test.dart \
            -d web-server --browser-name=chrome --headless

  # ---------------------------------------------------------------------------
  # Compile gates for the four tiers that cannot be run on hardware here.
  #
  # These do not prove anything renders. They prove the native half builds,
  # which for these platforms is the difference between "unverified" and
  # "unknown" — and it is the only automated coverage their Swift, Kotlin, C++
  # and CMake have.
  # ---------------------------------------------------------------------------
  ios:
    runs-on: macos-14
    env:
      MAPLIBRE_FLUTTER_BUILD_FROM_SOURCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: brew install cmake ninja ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ hashFiles('packages/maplibre_flutter_core/MBGL_CORE_VERSION') }}
          restore-keys: ccache-ios-
      - run: flutter config --enable-native-assets
      - run: flutter pub get
      # Swift Package Manager and CocoaPods must BOTH work until Flutter drops
      # the latter, so neither a migrated nor an unmigrated app breaks
      # (CLAUDE.md §8).
      - run: flutter config --enable-swift-package-manager
      - run: flutter build ios --simulator --debug
        working-directory: packages/maplibre_flutter/example
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter clean
        working-directory: packages/maplibre_flutter/example
      - run: flutter build ios --simulator --debug
        working-directory: packages/maplibre_flutter/example

  android:
    runs-on: ubuntu-latest
    env:
      MAPLIBRE_FLUTTER_BUILD_FROM_SOURCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The SDK's bundled CMake is 3.22.1 and the core needs >= 3.25
      # (CLAUDE.md §8).
      - run: sdkmanager 'cmake;3.31.4' 'ndk;27.0.12077973'
      - run: flutter config --enable-native-assets
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: packages/maplibre_flutter/example

  linux:
    runs-on: ubuntu-latest
    env:
      MAPLIBRE_FLUTTER_BUILD_FROM_SOURCE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache clang pkg-config \
            libgtk-3-dev liblzma-dev libcurl4-openssl-dev libegl1-mesa-dev \
            libgles2-mesa-dev libpng-dev libjpeg-dev libwebp-dev libuv1-dev \
            libicu-dev
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ hashFiles('packages/maplibre_flutter_core/MBGL_CORE_VERSION') }}
          restore-keys: ccache-linux-
      - run: flutter config --enable-native-assets --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --debug
        working-directory: packages/maplibre_flutter/example

  windows:
    runs-on: windows-2022
    env:
      MAPLIBRE_FLUTTER_BUILD_FROM_SOURCE: '1'
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The build hook runs `vcpkg install` and hands CMake the toolchain file;
      # a custom static triplet links the deps into the shim DLL so there are no
      # runtime DLLs to bundle (CLAUDE.md §8).
      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
      - run: flutter config --enable-native-assets --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --debug
        working-directory: packages/maplibre_flutter/example

  # The WASM arm is a STANDALONE Emscripten build — not `flutter build web`, not
  # hook/build.dart — so nothing in CI compiled it and nothing type-checked the
  # embind surface or its mbgl API use. That is most of the risk in this tier:
  # its C++ cannot be built on a machine without emsdk, so a change to it was
  # previously verified by nothing at all.
  #
  # Compile only. Running it needs a browser with a real GPU (CLAUDE.md §2).
  web-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-wasm-${{ hashFiles('packages/maplibre_flutter_core/MBGL_CORE_VERSION') }}
          restore-keys: ccache-wasm-

      - name: Build the embind module
        working-directory: packages/maplibre_flutter_core/web
        run: |
          emcmake cmake -G Ninja -S . -B ../build/wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build ../build/wasm --target maplibre_flutter_core_wasm

      - name: Publish the artifact
        uses: actions/upload-artifact@v4
        with:
          name: maplibre-flutter-core-wasm
          path: |
            packages/maplibre_flutter_core/build/wasm/maplibre_flutter_core.js
            packages/maplibre_flutter_core/build/wasm/maplibre_flutter_core.wasm
          if-no-files-found: error
